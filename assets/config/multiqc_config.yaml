report_comment: >
  This report has been generated by an alpha version of UNIFLOW

sp:
  fastqc/data:
    fn: "*fastqc_data.txt"

  bcftools/stats:
    fn: "*.consensus.bcftools_stats.txt"

  subsample_before_after:
    fn: "*_subsample_before_after_mqc.png"

custom_data:
  subsample_before_after:
    section_name: "Per-cell/amplicon read cap"
    description: >
      Reads for one amplicon in one cell, before and after the cap applied to
      the variant-calling BAM. Counts are variant-eligible reads in called
      cells, the population the cap acts on; the amplicon count matrix is a
      different denominator and stays at full depth.

remove_sections:
  - bcftools-stats_variant_quality_plot
  - bcftools-stats_indel_plot
  - bcftools-stats_depth_plot

custom_plot_config:
  samtools-flagstat-dp:
    no_violin: true

disable_version_detection: true

custom_css_files:
  - uniflow_report.css
