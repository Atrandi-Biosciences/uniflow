report_comment: >
  This report has been generated by an beta version of uniflow

sp:
  fastqc/data:
    fn: "*fastqc_data.txt"

  bcftools/stats:
    fn: "*.consensus.bcftools_stats.txt"

  subsample_before_after:
    fn: "*_subsample_before_after_mqc.png"

custom_data:
  subsample_before_after:
    section_name: "Read depth for variant calling"
    description: >
      Variant calling uses at most a fixed number of reads (the cap) for each
      amplicon in each cell, sampled with a fixed seed, so deeply sequenced
      cells do not outweigh the rest. Cell-amplicon pairs below the cap keep
      all their reads. Counts are variant-eligible reads in called cells, for
      cell-amplicon pairs with at least one read. The amplicon count matrix is
      not capped, so its counts will not match.

report_section_order:
  subsample_before_after:
    order: -1000

remove_sections:
  - bcftools-stats_variant_quality_plot
  - bcftools-stats_indel_plot
  - bcftools-stats_depth_plot

custom_plot_config:
  samtools-flagstat-dp:
    no_violin: true

disable_version_detection: true

custom_css_files:
  - uniflow_report.css
